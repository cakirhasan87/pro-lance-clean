<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Lance | Freelance Platformu</title>
    <!-- Google tag (gtag.js) -->
    <script>
      setTimeout(function() {
        var gtagScript = document.createElement('script');
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-483914364';
        gtagScript.async = true;
        document.head.appendChild(gtagScript);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-483914364');
      }, 2000);
    </script>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 
</head>
<body>
    <!-- Include the header -->
    <div id="header"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                    
                    const hamburger = document.querySelector('.hamburger');
                    const nav = document.querySelector('.nav');
                    
                    if (hamburger && nav) {
                        hamburger.addEventListener('click', () => {
                            hamburger.classList.toggle('active');
                            nav.classList.toggle('active');
                        });

                        // Close mobile menu when clicking outside
                        document.addEventListener('click', (e) => {
                            if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
                                nav.classList.remove('active');
                                hamburger.classList.remove('active');
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('Error loading header:', error);
                });
        });
    </script>

    <main>
        <!-- Rest of the existing content -->
        <a href="https://calendly.com/pro-lance-support/30min" target="_blank" class="calendly-btn" onclick="gtag('event', 'schedule_call_click', {event_category: 'engagement', event_label: 'Görüşme Planla Butonu'});">
            <i class="far fa-calendar-alt"></i> 30 Dakikalık Görüşme Planla
        </a>
    </main>

    <!-- Include the footer -->
    <div id="footer"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer').innerHTML = data;
                    const footerDiv = document.getElementById('footer');
                    footerDiv.innerHTML = `
                        <footer>
                            <div class="footer-content">
                                <div class="footer-section">
                                    <h3>Pro-Lance</h3>
                                    <p>Yetenekler Buluşur, Projeler Büyür</p>
                                </div>
                            </div>
                        </footer>
                    `;
                })
                .catch(error => {
                    console.error('Error loading footer:', error);
                });
        });
    </script>

    <script src="../script.js" defer></script>
    
    <!-- Cookie Consent Script -->
    <script type="module" src="../cookie-consent.js"></script>
</body>
</html>
