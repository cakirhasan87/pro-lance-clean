<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Supabase API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
    </style>
<!-- Chat Widget Template -->
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
<script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
        webhookUrl: 'https://pro-lance.app.n8n.cloud/webhook/23795385-dda6-498e-9d37-4d1b2d47ec93/chat',
        title: 'Pro-Lance Support',
        subtitle: 'Ask us anything about our services',
        primaryColor: '#4CAF50',
        position: 'right',
        showInitialMessage: true,
        initialMessage: 'Hello! How can we help you today?',
        allowFileUpload: false,
        enableMarkdown: true,
        debug: true
    });
</script> 
</head>
<body>
    <h1>Direct Supabase API Test</h1>
    
    <form id="testForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required value="Test User">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required value="test@example.com">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" value="1234567890">
        </div>
        
        <div class="form-group">
            <label for="subject">Subject:</label>
            <select id="subject" required>
                <option value="test">Test Message</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" rows="4" required>This is a test message.</textarea>
        </div>
        
        <button type="submit">Submit Test</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const testForm = document.getElementById('testForm');
            const resultDiv = document.getElementById('result');
            
            testForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                resultDiv.innerHTML = 'Sending test data...';
                resultDiv.className = 'result';
                resultDiv.style.display = 'block';
                
                const testData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value || null,
                    subject: document.getElementById('subject').value,
                    message: document.getElementById('message').value,
                    created_at: new Date().toISOString(),
                    status: 'unread'
                };
                
                console.log('Sending test data:', testData);
                
                try {
                    const response = await fetch('https://drxstcmoroaupedsynhq.supabase.co/rest/v1/contact_messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyeHN0Y21vcm9hdXBlZHN5bmhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI4MTA2NDAsImV4cCI6MjA1ODM4NjY0MH0.9AjInAaxWnYesZ_UuDOKtJVfVNO_RetqMmvZsCql11k',
                            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyeHN0Y21vcm9hdXBlZHN5bmhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI4MTA2NDAsImV4cCI6MjA1ODM4NjY0MH0.9AjInAaxWnYesZ_UuDOKtJVfVNO_RetqMmvZsCql11k',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(testData)
                    });
                    
                    console.log('Response status:', response.status);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`API Error: ${response.status} - ${errorText}`);
                    }
                    
                    resultDiv.innerHTML = '<h3>Success!</h3><p>Data was successfully sent to Supabase.</p>';
                    resultDiv.className = 'result success';
                    
                } catch (error) {
                    console.error('Error:', error);
                    resultDiv.innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
                    resultDiv.className = 'result error';
                }
            });
        });
    </script>
</body>
</html>
