<!-- Cookie Consent Banner -->
<div id="cookie-consent-banner" class="cookie-consent-banner" style="display: none;">
    <div class="cookie-consent-content">
        <p>Bu web sitesi deneyiminizi geliştirmek için çerezleri kullanır. Sitemizi kullanmaya devam ederek çerez kullanımını kabul etmiş olursunuz.</p>
        <div class="cookie-consent-buttons">
            <button id="accept-cookies" class="cookie-btn accept">Kabul Et</button>
            <button id="reject-cookies" class="cookie-btn reject">Reddet</button>
        </div>
    </div>
</div>

<style>
.cookie-consent-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.9);
    color: white;
    padding: 1rem;
    z-index: 9999;
    font-size: 14px;
}

.cookie-consent-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
}

.cookie-consent-buttons {
    display: flex;
    gap: 0.5rem;
}

.cookie-btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

.cookie-btn.accept {
    background: #007bff;
    color: white;
}

.cookie-btn.reject {
    background: #6c757d;
    color: white;
}

@media (max-width: 768px) {
    .cookie-consent-content {
        flex-direction: column;
        text-align: center;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const banner = document.getElementById('cookie-consent-banner');
    const acceptBtn = document.getElementById('accept-cookies');
    const rejectBtn = document.getElementById('reject-cookies');
    
    // Check if user has already made a choice
    if (!localStorage.getItem('cookieConsent')) {
        banner.style.display = 'block';
    }
    
    acceptBtn.addEventListener('click', function() {
        localStorage.setItem('cookieConsent', 'accepted');
        banner.style.display = 'none';
    });
    
    rejectBtn.addEventListener('click', function() {
        localStorage.setItem('cookieConsent', 'rejected');
        banner.style.display = 'none';
    });
});
</script>
