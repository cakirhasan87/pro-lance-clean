<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Lance | Freelance Platformu</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<!-- Chat Widget Template -->
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
<script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
        webhookUrl: 'https://pro-lance.app.n8n.cloud/webhook/23795385-dda6-498e-9d37-4d1b2d47ec93/chat',
        title: 'Pro-Lance Support',
        subtitle: 'Ask us anything about our services',
        primaryColor: '#4CAF50',
        position: 'right',
        showInitialMessage: true,
        initialMessage: 'Hello! How can we help you today?',
        allowFileUpload: false,
        enableMarkdown: true,
        debug: true
    });
</script> 
<script>
  setTimeout(function() {
    var gtagScript = document.createElement('script');
    gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-483914364';
    gtagScript.async = true;
    document.head.appendChild(gtagScript);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-483914364');
  }, 2000);
</script>
</head>
<body>
    <!-- Include the header -->
    <div id="header"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                    
                    const hamburger = document.querySelector('.hamburger');
                    const nav = document.querySelector('.nav');
                    
                    if (hamburger && nav) {
                        hamburger.addEventListener('click', () => {
                            hamburger.classList.toggle('active');
                            nav.classList.toggle('active');
                        });

                        // Close mobile menu when clicking outside
                        document.addEventListener('click', (e) => {
                            if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
                                nav.classList.remove('active');
                                hamburger.classList.remove('active');
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('Error loading header:', error);
                });
        });
    </script>

    <main>
        <!-- Rest of the existing content -->
    </main>

    <script src="../script.js" defer></script>
    
    <!-- Cookie Consent Script -->
    <script type="module" src="../../cookie-consent.js"></script>
</body>
</html>
