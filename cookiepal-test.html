<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookiePal Test</title>
<!-- Chat Widget Template -->
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
<script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
        webhookUrl: 'https://pro-lance.app.n8n.cloud/webhook/23795385-dda6-498e-9d37-4d1b2d47ec93/chat',
        title: 'Pro-Lance Support',
        subtitle: 'Ask us anything about our services',
        primaryColor: '#4CAF50',
        position: 'right',
        showInitialMessage: true,
        initialMessage: 'Hello! How can we help you today?',
        allowFileUpload: false,
        enableMarkdown: true,
        debug: true
    });
</script> 
</head>
<body>
    <h1>CookiePal Test Page</h1>
    <p>This page tests if the CookiePal banner appears correctly.</p>

    <!-- Start cookiepal banner -->
    <script id="cookiepal" type="text/javascript" src="https://cdn.cookiepal.io/client_data/0a636fef-1e52-48d0-9315-487c8b3e5156/script.js"></script>
    <!-- End cookiepal banner -->
    
    <script>
    // Try to manually initialize CookiePal after page load
    document.addEventListener('DOMContentLoaded', function() {
        // Check if CookiePal was loaded
        if (typeof cookiepal !== 'undefined') {
            console.log('CookiePal is loaded');
            // Try to manually show the banner if it exists
            if (typeof cookiepal.showBanner === 'function') {
                cookiepal.showBanner();
            }
        } else {
            console.log('CookiePal is not loaded');
        }
    });
    </script>
</body>
</html>
