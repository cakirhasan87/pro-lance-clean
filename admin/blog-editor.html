<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .admin-title {
            margin: 0;
        }
        
        .admin-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        
        .admin-btn:hover {
            background-color: #45a049;
        }
        
        .admin-btn.delete {
            background-color: #dc3545;
        }
        
        .admin-btn.delete:hover {
            background-color: #c82333;
        }
        
        .admin-btn.edit {
            background-color: #007bff;
        }
        
        .admin-btn.edit:hover {
            background-color: #0069d9;
        }
        
        .login-required {
            text-align: center;
            padding: 3rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 2rem auto;
            max-width: 500px;
        }
        
        .login-form {
            margin-top: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        
        .form-group textarea {
            min-height: 150px;
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            display: none;
        }
        
        .success-message {
            color: #28a745;
            margin-top: 1rem;
        }
        
        .blog-list {
            margin-top: 2rem;
        }
        
        .blog-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .blog-table th,
        .blog-table td {
            padding: 1rem;
            border-bottom: 1px solid #dee2e6;
            text-align: left;
        }
        
        .blog-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        
        .blog-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .blog-title {
            font-weight: 600;
        }
        
        .blog-date {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 2rem;
        }
        
        .tab {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
        }
        
        .tab.active {
            border-bottom-color: #4CAF50;
            color: #4CAF50;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            margin-top: 1rem;
        }
        
        .thumbnail-col img {
            width: 80px;
            height: 50px;
            object-fit: cover;
        }
        
        .blog-posts {
            margin-top: 20px;
        }
        .blog-post {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .blog-post h3 {
            margin-top: 0;
        }
        .blog-post .meta {
            color: #666;
            font-size: 0.9em;
            margin: 5px 0;
        }
        .blog-post .actions {
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading:after {
            content: '...';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80% { content: '....'; }
            100% { content: '.....'; }
        }
        .retry-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .retry-button:hover {
            background-color: #218838;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-draft {
            background-color: #ffd700;
            color: #000;
        }
        .status-published {
            background-color: #28a745;
            color: white;
        }
    </style>

        title: 'Pro-Lance Support',
        subtitle: 'Ask us anything about our services',

        initialMessage: 'Hello! How can we help you today?',
        allowFileUpload: false,

</script> 
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Blog Editor</h1>
            <div>
                <a href="index.html" class="admin-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                <button id="logoutBtn" class="admin-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <!-- Login Form -->
        <div id="loginContainer" class="login-required">
            <h2>Admin Login Required</h2>
            <p>Please enter your credentials to access the blog editor.</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="admin-btn">Log In</button>
            </form>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>
        
        <!-- Blog Editor Interface -->
        <div id="editorContainer" style="display: none;">
            <div class="tabs">
                <div class="tab active" data-tab="blog-posts">Blog Posts</div>
                <div class="tab" data-tab="new-post">New Post</div>
            </div>
            
            <!-- Blog Posts List -->
            <div id="blog-posts" class="tab-content active">
                <div id="posts-loading" class="loading">Loading blog posts...</div>
                <div id="posts-error" class="error-message" style="display: none;">
                    <p>Error loading blog posts.</p>
                    <button class="retry-button" onclick="loadBlogPosts()">Retry</button>
                </div>
                <div id="posts-container" class="blog-posts"></div>
            </div>
            
            <!-- Blog Editor Form -->
            <div id="new-post" class="tab-content">
                <form id="blog-form" onsubmit="handleBlogSubmit(event)">
                    <div class="form-group">
                        <label for="title">Title*</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">Content*</label>
                        <textarea id="content" name="content" rows="10" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="thumbnail">Thumbnail Image</label>
                        <input type="file" id="thumbnail" name="thumbnail" accept="image/*">
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="admin-btn">Save Post</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentTab = 'blog-posts';
        let blogPosts = [];
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
            
            if (isLoggedIn) {
                showEditorInterface();
            } else {
                showLoginForm();
            }
            
            // Set up event listeners
            setupEventListeners();
        });
        
        // Set up event listeners
        function setupEventListeners() {
            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });
            
            // Login form submission
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            
            // Blog form submission
            document.getElementById('blog-form').addEventListener('submit', handleBlogSubmit);
            
            // Thumbnail preview
            const thumbnailInput = document.getElementById('thumbnail');
            if (thumbnailInput) {
                thumbnailInput.addEventListener('change', handleThumbnailPreview);
            }
        }
        
        // Handle login form submission
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simple authentication - in a real app, this would be server-side
            if (username === 'admin' && password === 'admin') {
                localStorage.setItem('adminLoggedIn', 'true');
                showEditorInterface();
            } else {
                const loginError = document.getElementById('loginError');
                loginError.textContent = 'Invalid username or password';
                loginError.style.display = 'block';
            }
        }
        
        // Show editor interface
        function showEditorInterface() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('editorContainer').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            loadBlogPosts();
        }
        
        // Show login form
        function showLoginForm() {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('editorContainer').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }
        
        // Switch between tabs
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab styling
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            
            // Show/hide content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `${tab}Tab`);
            });
        }
        
        // Handle blog form submission
        async function handleBlogSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/api/blog/posts', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }

                // Clear form and show success message
                form.reset();
                alert('Blog post saved successfully!');
                
                // Reload posts and switch to posts tab
                await loadBlogPosts();
                showTab('blog-posts');
            } catch (error) {
                console.error('Error saving blog post:', error);
                alert(`Error saving blog post: ${error.message}`);
            }
        }
        
        // Handle thumbnail preview
        function handleThumbnailPreview(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('thumbnailPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        // Load blog posts
        async function loadBlogPosts() {
            const loadingEl = document.getElementById('posts-loading');
            const errorEl = document.getElementById('posts-error');
            const containerEl = document.getElementById('posts-container');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            containerEl.innerHTML = '';

            try {
                const response = await fetch('/api/blog/posts');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                blogPosts = data;
                renderBlogPosts();
                loadingEl.style.display = 'none';
            } catch (error) {
                console.error('Error loading blog posts:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.querySelector('p').textContent = `Error loading blog posts: ${error.message}`;
            }
        }
        
        // Render blog posts
        function renderBlogPosts() {
            const containerEl = document.getElementById('posts-container');
            containerEl.innerHTML = '';

            if (!blogPosts || blogPosts.length === 0) {
                containerEl.innerHTML = '<p>No blog posts found.</p>';
                return;
            }

            blogPosts.forEach(post => {
                const postEl = document.createElement('div');
                postEl.className = 'blog-post';
                
                const date = new Date(post.created_at).toLocaleDateString();
                const statusClass = post.status === 'published' ? 'status-published' : 'status-draft';
                
                postEl.innerHTML = `
                    <h3>${post.title}</h3>
                    <div class="meta">
                        <span>Created: ${date}</span>
                        <span class="status-badge ${statusClass}">${post.status}</span>
                    </div>
                    <p>${post.content.substring(0, 200)}${post.content.length > 200 ? '...' : ''}</p>
                    <div class="actions">
                        <button onclick="editPost('${post.id}')" class="admin-btn edit">Edit</button>
                        <button onclick="deletePost('${post.id}')" class="admin-btn delete">Delete</button>
                    </div>
                `;
                
                containerEl.appendChild(postEl);
            });
        }
        
        // Logout function
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.reload();
        }
    </script>
</body>
</html>
