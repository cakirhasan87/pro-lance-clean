<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages - Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header flex">
        <div class="header-container">
            <div class="logo">
                <a href="../index.html">
                    <h2>Pro-Lance</h2>
                </a>
            </div>
            <div class="admin-user-info">
                <span id="adminUsername">Admin</span>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Admin Navigation -->
    <nav class="admin-nav">
        <div class="admin-nav-container">
            <a href="dashboard.html" class="admin-nav-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="content-manager.html" class="admin-nav-item">
                <i class="fas fa-edit"></i> Content Manager
            </a>
            <a href="enhanced-blog-editor.html" class="admin-nav-item">
                <i class="fas fa-blog"></i> Blog Editor
            </a>
            <a href="contact-messages.html" class="admin-nav-item active">
                <i class="fas fa-envelope"></i> Contact Messages
            </a>
        </div>
    </nav>

    <main class="admin-main">
        <div class="admin-header">
            <h1>Contact Messages</h1>
            <p>View and manage contact form submissions</p>
        </div>
        
        <div class="content-filters">
            <div class="filter-group">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="">All Messages</option>
                    <option value="new">New</option>
                    <option value="read">Read</option>
                    <option value="replied">Replied</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="searchFilter">Search:</label>
                <input type="text" id="searchFilter" placeholder="Search messages...">
            </div>
            
            <div class="filter-group">
                <button id="exportBtn" class="btn-secondary">
                    <i class="fas fa-download"></i> Export
                </button>
            </div>
        </div>
        
        <div class="blog-list">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="messagesList">
                    <!-- Messages will be loaded here dynamically -->
                </tbody>
            </table>
        </div>
    </main>
    
    <div id="notification" class="notification"></div>
    
    <script src="../script.js"></script>
    <script>
        // Contact Messages Manager
        class ContactMessagesManager {
            constructor() {
                this.messages = [];
                this.currentFilters = {
                    status: '',
                    search: ''
                };
                this.init();
            }

            init() {
                this.loadSampleData();
                this.setupEventListeners();
                this.renderMessages();
            }

            loadSampleData() {
                // Load from localStorage or use sample data
                const savedData = localStorage.getItem('contactMessages');
                if (savedData) {
                    this.messages = JSON.parse(savedData);
                } else {
                    this.messages = [
                        {
                            id: 1,
                            name: 'Ahmet Yılmaz',
                            email: 'ahmet@example.com',
                            subject: 'SAP Danışmanlığı Hakkında',
                            message: 'Merhaba, SAP implementasyonu konusunda danışmanlık hizmetiniz hakkında bilgi almak istiyorum.',
                            date: '2024-01-15T10:30:00',
                            status: 'new'
                        },
                        {
                            id: 2,
                            name: 'John Smith',
                            email: 'john@company.com',
                            subject: 'IT Consulting Services',
                            message: 'Hello, I would like to discuss your IT consulting services for our company.',
                            date: '2024-01-14T14:20:00',
                            status: 'read'
                        },
                        {
                            id: 3,
                            name: 'Ayşe Demir',
                            email: 'ayse@firma.com',
                            subject: 'Web Geliştirme Projesi',
                            message: 'Firmamız için web sitesi geliştirme projesi hakkında görüşmek istiyoruz.',
                            date: '2024-01-13T09:15:00',
                            status: 'replied'
                        }
                    ];
                    this.saveMessages();
                }
            }

            saveMessages() {
                localStorage.setItem('contactMessages', JSON.stringify(this.messages));
            }

            setupEventListeners() {
                const statusFilter = document.getElementById('statusFilter');
                const searchFilter = document.getElementById('searchFilter');
                const exportBtn = document.getElementById('exportBtn');

                if (statusFilter) {
                    statusFilter.addEventListener('change', (e) => {
                        this.currentFilters.status = e.target.value;
                        this.renderMessages();
                    });
                }

                if (searchFilter) {
                    searchFilter.addEventListener('input', (e) => {
                        this.currentFilters.search = e.target.value;
                        this.renderMessages();
                    });
                }

                if (exportBtn) {
                    exportBtn.addEventListener('click', () => {
                        this.exportMessages();
                    });
                }
            }

            renderMessages() {
                const container = document.getElementById('messagesList');
                if (!container) return;

                const filteredMessages = this.getFilteredMessages();

                if (filteredMessages.length === 0) {
                    container.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: #666;">No messages found.</td></tr>';
                    return;
                }

                container.innerHTML = filteredMessages.map(message => `
                    <tr>
                        <td>${message.name}</td>
                        <td>${message.email}</td>
                        <td>${message.subject}</td>
                        <td>${this.formatDate(message.date)}</td>
                        <td><span class="status-badge status-${message.status}">${message.status}</span></td>
                        <td>
                            <div class="blog-actions">
                                <button class="blog-action-btn view" onclick="contactManager.viewMessage(${message.id})">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="blog-action-btn edit" onclick="contactManager.markAsRead(${message.id})">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="blog-action-btn delete" onclick="contactManager.deleteMessage(${message.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            getFilteredMessages() {
                return this.messages.filter(message => {
                    // Status filter
                    if (this.currentFilters.status && message.status !== this.currentFilters.status) {
                        return false;
                    }

                    // Search filter
                    if (this.currentFilters.search) {
                        const searchTerm = this.currentFilters.search.toLowerCase();
                        return message.name.toLowerCase().includes(searchTerm) ||
                               message.email.toLowerCase().includes(searchTerm) ||
                               message.subject.toLowerCase().includes(searchTerm) ||
                               message.message.toLowerCase().includes(searchTerm);
                    }

                    return true;
                });
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }

            viewMessage(messageId) {
                const message = this.messages.find(m => m.id === messageId);
                if (!message) return;

                // Create modal
                const modal = document.createElement('div');
                modal.className = 'preview-modal';
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0,0,0,0.8);
                    z-index: 1000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;

                modal.innerHTML = `
                    <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 600px; max-height: 80vh; overflow-y: auto;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h3>Message Details</h3>
                            <button onclick="this.closest('.preview-modal').remove()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
                        </div>
                        <div style="line-height: 1.6;">
                            <p><strong>From:</strong> ${message.name} (${message.email})</p>
                            <p><strong>Subject:</strong> ${message.subject}</p>
                            <p><strong>Date:</strong> ${this.formatDate(message.date)}</p>
                            <p><strong>Status:</strong> <span class="status-badge status-${message.status}">${message.status}</span></p>
                            <hr style="margin: 1rem 0;">
                            <p><strong>Message:</strong></p>
                            <div style="background: #f8f9fa; padding: 1rem; border-radius: 4px; white-space: pre-wrap;">${message.message}</div>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                // Close on background click
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            }

            markAsRead(messageId) {
                const message = this.messages.find(m => m.id === messageId);
                if (message) {
                    message.status = 'read';
                    this.saveMessages();
                    this.renderMessages();
                    this.showNotification('Message marked as read.', 'success');
                }
            }

            deleteMessage(messageId) {
                if (confirm('Are you sure you want to delete this message?')) {
                    this.messages = this.messages.filter(m => m.id !== messageId);
                    this.saveMessages();
                    this.renderMessages();
                    this.showNotification('Message deleted successfully.', 'success');
                }
            }

            exportMessages() {
                const filteredMessages = this.getFilteredMessages();
                const csvContent = this.convertToCSV(filteredMessages);
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `contact-messages-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                this.showNotification('Messages exported successfully.', 'success');
            }

            convertToCSV(messages) {
                const headers = ['Name', 'Email', 'Subject', 'Message', 'Date', 'Status'];
                const rows = messages.map(m => [m.name, m.email, m.subject, m.message, m.date, m.status]);
                return [headers, ...rows].map(row => row.map(field => `"${field}"`).join(',')).join('\n');
            }

            showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                if (!notification) return;

                notification.textContent = message;
                notification.className = `notification ${type}`;
                notification.classList.add('show');

                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }

        // Authentication check
        class AdminAuth {
            constructor() {
                this.sessionTimeout = 30 * 60 * 1000; // 30 minutes
                this.init();
            }

            init() {
                if (!this.checkSession()) {
                    this.redirectToLogin();
                }
                this.setupEventListeners();
                this.updateUserInfo();
            }

            checkSession() {
                const session = localStorage.getItem('adminSession');
                if (session) {
                    const sessionData = JSON.parse(session);
                    const now = Date.now();
                    
                    if (now - sessionData.timestamp < this.sessionTimeout) {
                        // Update session timestamp
                        sessionData.timestamp = now;
                        localStorage.setItem('adminSession', JSON.stringify(sessionData));
                        return true;
                    } else {
                        localStorage.removeItem('adminSession');
                    }
                }
                return false;
            }

            setupEventListeners() {
                const logoutBtn = document.getElementById('logoutBtn');
                logoutBtn.addEventListener('click', () => this.logout());
            }

            updateUserInfo() {
                const session = localStorage.getItem('adminSession');
                if (session) {
                    const sessionData = JSON.parse(session);
                    const usernameElement = document.getElementById('adminUsername');
                    usernameElement.textContent = sessionData.username;
                }
            }

            logout() {
                localStorage.removeItem('adminSession');
                this.redirectToLogin();
            }

            redirectToLogin() {
                window.location.href = 'login.html';
            }
        }

        // Initialize
        let contactManager;
        document.addEventListener('DOMContentLoaded', () => {
            contactManager = new ContactMessagesManager();
            const adminAuth = new AdminAuth();
        });
    </script>
</body>
</html>
